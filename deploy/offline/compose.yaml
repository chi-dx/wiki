name: kunpeng-wiki

services:
  compiler:
    image: team-wiki-compiler:arm64
    env_file: .env
    environment:
      COMPILER_HOST: 0.0.0.0
      COMPILER_ROOT: /compiler-data
    volumes:
      - compiler-data:/compiler-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8010/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: team-wiki:arm64
    env_file: .env
    environment:
      DATA_DIR: /data
      KNOWLEDGE_BACKEND: compiler
      COMPILER_URL: http://compiler:8010
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - wiki-data:/data
    restart: unless-stopped
    depends_on:
      compiler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  sync:
    image: team-wiki:arm64
    command: ["/app/.venv/bin/python", "-m", "app.sync"]
    env_file: .env
    environment:
      DATA_DIR: /data
      KNOWLEDGE_BACKEND: compiler
      COMPILER_URL: http://compiler:8010
    volumes:
      - wiki-data:/data
    restart: unless-stopped
    depends_on:
      compiler:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  wiki-data:
  compiler-data:
